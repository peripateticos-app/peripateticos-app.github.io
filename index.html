<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peripatéticos · Muy pronto</title>
<meta name="description" content="Tu app, desde el móvil. Y es tuya.">
<meta name="build" content="PP-B1-20260930-001">
<style>
  :root { --fondo: #faf7f2; --texto: #1f1d1a; --suave: #6b655c; --marca: #c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #16140f; --texto: #f2eee6; --suave: #a39c90; --marca: #fb923c; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fondo); color: var(--texto);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 24px 16px;
  }
  main { max-width: 34rem; text-align: center; }
  .marca { font-size: .8rem; letter-spacing: .18em; text-transform: uppercase; color: var(--marca); margin: 0 0 1rem; }
  h1 { font-size: clamp(2rem, 8vw, 3rem); line-height: 1.1; margin: 0 0 1rem; }
  p { margin: 0 0 .75rem; color: var(--suave); }
  .pronto { display: inline-block; margin-top: 1.25rem; padding: .35rem .9rem; border: 1px solid var(--marca); border-radius: 999px; color: var(--marca); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <p class="marca">Peripatéticos</p>
  <h1>Tu app, desde el móvil. Y es tuya.</h1>
  <p>Cuéntale tu idea a una IA mientras paseas y tenla publicada en minutos.</p>
  <span class="pronto">Muy pronto</span>
</main>
</body>
</html>
